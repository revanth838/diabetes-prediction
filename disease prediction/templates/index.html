<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diabetes Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="icon-circle">&#9877;</div>
        <h1>Diabetes Prediction</h1>
        <p class="subtitle">Enter patient health details below</p>
      </div>

      <form action="/predict" method="POST">
        <div class="grid">

          <div class="field">
            <label for="Pregnancies">Pregnancies</label>
            <input type="number" id="Pregnancies" name="Pregnancies"
                   min="0" max="20" step="1" placeholder="e.g. 2" required/>
            <span class="hint">Number of times pregnant</span>
          </div>

          <div class="field">
            <label for="Glucose">Glucose (mg/dL)</label>
            <input type="number" id="Glucose" name="Glucose"
                   min="0" max="300" step="1" placeholder="e.g. 120" required/>
            <span class="hint">Plasma glucose concentration</span>
          </div>

          <div class="field">
            <label for="BloodPressure">Blood Pressure (mm Hg)</label>
            <input type="number" id="BloodPressure" name="BloodPressure"
                   min="0" max="200" step="1" placeholder="e.g. 70" required/>
            <span class="hint">Diastolic blood pressure</span>
          </div>

          <div class="field">
            <label for="SkinThickness">Skin Thickness (mm)</label>
            <input type="number" id="SkinThickness" name="SkinThickness"
                   min="0" max="100" step="1" placeholder="e.g. 20" required/>
            <span class="hint">Triceps skin fold thickness</span>
          </div>

          <div class="field">
            <label for="Insulin">Insulin (mu U/ml)</label>
            <input type="number" id="Insulin" name="Insulin"
                   min="0" max="900" step="1" placeholder="e.g. 80" required/>
            <span class="hint">2-Hour serum insulin</span>
          </div>

          <div class="field">
            <label for="BMI">BMI (kg/m²)</label>
            <input type="number" id="BMI" name="BMI"
                   min="0" max="70" step="0.1" placeholder="e.g. 25.0" required/>
            <span class="hint">Body mass index</span>
          </div>

          <div class="field">
            <label for="DiabetesPedigreeFunction">Diabetes Pedigree</label>
            <input type="number" id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction"
                   min="0" max="3" step="0.001" placeholder="e.g. 0.351" required/>
            <span class="hint">Diabetes pedigree function score</span>
          </div>

          <div class="field">
            <label for="Age">Age (years)</label>
            <input type="number" id="Age" name="Age"
                   min="0" max="120" step="1" placeholder="e.g. 25" required/>
            <span class="hint">Patient age</span>
          </div>

        </div>

        <button type="submit" class="btn-predict">Predict Now</button>
      </form>
    </div>
  </div>
</body>
</html>
